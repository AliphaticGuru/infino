services:
  app:
    image: hardcore28/lara-base:8.5.7
    container_name: infino-app
    # working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    env_file:
      - src/.env
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
  cli:
    build:
      context: ./docker/laravel-cli
    
    container_name: infino-cli
    working_dir: /var/www/html
    volumes:
      # uncomment the following line and use for building laravel project with "docker compose run --rm -it infino-laravel-cli bash" comment when done
      # - ./:/var/www/html
      - ./src:/var/www/html
    # env_file:
    #   - src/.env
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: infino-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./src:/var/www/html
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      - app
  db:
    image: postgres:16-alpine
    container_name: infino-db
    env_file:
      - src/.env
    environment:
      POSTGRES_USER: infino
      POSTGRES_PASSWORD: infino
      POSTGRES_DB: laravel
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [
              "CMD-SHELL", 
              "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"
            ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: infino-redis
    ports:
      - "6379:6379"
    networks:
      - app-network
    volumes:
      - redis-data:/data
    restart: unless-stopped
networks:
  app-network: 
    driver: bridge
volumes:
  db-data:
  redis-data:
